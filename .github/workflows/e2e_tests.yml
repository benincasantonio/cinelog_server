name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  e2e_tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:17-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: cinelog_e2e_db
          POSTGRES_USER: cinelog
          POSTGRES_PASSWORD: cinelog
        options: >-
          --health-cmd="pg_isready -U cinelog -d cinelog_e2e_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --frozen --group dev

      - name: Prepare PostgreSQL schema
        run: |
          uv run alembic upgrade head
        env:
          JWT_SECRET_KEY: test-jwt-secret-key-for-e2e-1234567890
          RATE_LIMIT_HMAC_SECRET: test-rate-limit-hmac-secret
          REGISTRATION_VERIFICATION_HMAC_SECRET: test-registration-verification-hmac-secret
          DATABASE_URL: postgresql+asyncpg://cinelog:cinelog@localhost:5433/cinelog_e2e_db

      - name: Run E2E Tests
        run: |
          uv run pytest tests/e2e -v
        env:
          JWT_SECRET_KEY: test-jwt-secret-key-for-e2e-1234567890
          RATE_LIMIT_HMAC_SECRET: test-rate-limit-hmac-secret
          REGISTRATION_VERIFICATION_HMAC_SECRET: test-registration-verification-hmac-secret
          REDIS_URL: redis://localhost:6380/0
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
