name: cinelog-prod

x-app-env: &app-env
  env_file:
    - .env
  environment:
    DB_BACKEND: postgres
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cinelog}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production Compose}@postgres:5432/${POSTGRES_DB:-cinelog_db}
    MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to the source MongoDB before production data migration}
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinelog_db}
      POSTGRES_USER: ${POSTGRES_USER:-cinelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production Compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinelog} -d ${POSTGRES_DB:-cinelog_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-migrate:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: >
      sh -c "alembic upgrade head &&
      python -m db_migrations.runner --yes"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "5009:5009"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5009/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
